[project]
name = "optilab-engine"
version = "0.1.0"
description = "OptiLab optical engine: sequential + non-sequential tracing, FastAPI sidecar"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
build = ["pyinstaller>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["optilab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
