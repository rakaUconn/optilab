[package]
name = "optilab"
version = "0.1.0"
description = "OptiLab - optical design"
edition = "2021"
license = "MIT"

[lib]
name = "optilab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
