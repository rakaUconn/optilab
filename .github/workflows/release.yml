name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,      args: "--target aarch64-apple-darwin", triple: aarch64-apple-darwin }
          - { os: macos-15-intel,    args: "--target x86_64-apple-darwin",  triple: x86_64-apple-darwin }   # native Intel runner so PyInstaller freezes an x86_64 engine
          - { os: windows-latest,    args: "",                              triple: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04,      args: "",                              triple: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ contains(matrix.os, 'macos') && matrix.triple || '' }}" }
      - name: Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Freeze Python engine (sidecar)
        run: |
          pip install -e "engine[build]"
          python engine/scripts/build_sidecar.py --target ${{ matrix.triple }}
      - run: npm ci
        working-directory: apps/desktop
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarisation (skipped automatically when the secrets are unset)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}                   # base64 of the Developer ID Application .p12
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}         # "Developer ID Application: Name (TEAMID)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                         # app-specific password
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "OptiLab ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
