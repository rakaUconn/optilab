name: CI
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e "engine[dev]"
      - run: python engine/scripts/export_schema.py --check
      - run: cd engine && pytest -q
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: cd apps/desktop && npm ci && npm run gen:types && git diff --exit-code src/types && npm run typecheck && npm run build
